spring.application.name=Sistema_de_Evaluacion_de_Proyectos

# Perfil activo: mysql o postgres
app.db.primary.url=jdbc:mysql://localhost:3307/evaluacion_proyectos?createDatabaseIfNotExist=true
app.db.primary.username=root
app.db.primary.password=123456

app.db.fallback.url=jdbc:postgresql://localhost:5432/evaluacion_proyectos
app.db.fallback.username=daniel
app.db.fallback.password=123456
# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
spring.jpa.open-in-view=false


# JWT
app.jwt.secret=QM8G8J++F5pPilnt9enM4mKjc9VX7L+A6HIMWaTCA34=
app.jwt.expiration-ms=86400000

# CORS
app.cors.origin=http://localhost:5173
# Recuperación de contraseña
# Configura MAIL_ENABLED=true junto con MAIL_USERNAME y MAIL_PASSWORD para enviar por SMTP.
# El código también se registra en la consola del servidor para soporte administrativo.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

# SMTP. No guardes la contraseña en este archivo; usa variables de entorno.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

