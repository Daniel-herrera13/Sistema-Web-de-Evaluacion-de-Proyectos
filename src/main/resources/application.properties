spring.application.name=Sistema_de_Evaluacion_de_Proyectos

# Selección manual desde este archivo: primary (MySQL) o fallback (PostgreSQL).
# PostgreSQL es respaldo configurado; no se activa automáticamente si MySQL falla.
app.db.active=primary
app.db.primary.url=jdbc:mysql://localhost:3307/evaluacion_proyectos?createDatabaseIfNotExist=true
app.db.primary.username=root
app.db.primary.password=123456
app.db.fallback.url=jdbc:postgresql://localhost:5432/evaluacion_proyectos
app.db.fallback.username=daniel
app.db.fallback.password=123456
# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
spring.jpa.open-in-view=false


# JWT
app.jwt.secret=QM8G8J++F5pPilnt9enM4mKjc9VX7L+A6HIMWaTCA34=
app.jwt.expiration-ms=86400000

# CORS
app.cors.origin=http://localhost:5173
# Recuperación de contraseña
# Solo estas cuentas pueden recibir mensajes de recuperación; además deben existir y estar activas.
# Sobrescribe la lista con RECOVERY_ALLOWED_EMAILS (separada por comas) si hace falta.
app.recuperacion.correos-permitidos=${RECOVERY_ALLOWED_EMAILS:fernando.castaneda25@itca.edu.sv,dennis.serrano25@itca.edu.sv,yesica.anaya25@itca.edu.sv,fatima.miranda25@itca.edu.sv,natalie.menendez25@itca.edu.sv}
# Activar correo: define MAIL_ENABLED=true en la configuración de ejecución de IntelliJ.
# APP_MAIL_ENABLED también se acepta como nombre alternativo.
app.mail.enabled=${MAIL_ENABLED:${APP_MAIL_ENABLED:false}}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
# SMTP. No guardes la contraseña en este archivo; usa variables de entorno.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Gmail SMTP usa smtp.gmail.com, puerto 587 y STARTTLS. MAIL_PASSWORD debe ser una contraseña de aplicación.
