spring.application.name=Sistema_de_Evaluacion_de_Proyectos

# Selección manual: DB_TYPE=mysql (principal) o DB_TYPE=postgres (secundaria).
# El backend conecta únicamente al motor seleccionado y falla al iniciar si no está disponible.
app.db.active=${DB_TYPE:mysql}
app.db.mysql.url=${MYSQL_URL:jdbc:mysql://localhost:3307/evaluacion_proyectos?createDatabaseIfNotExist=true}
app.db.mysql.username=${MYSQL_USER:evaluacion}
app.db.mysql.password=${MYSQL_PASSWORD:evaluacion123}
app.db.postgres.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/evaluacion_proyectos}
app.db.postgres.username=${POSTGRES_USER:evaluacion}
app.db.postgres.password=${POSTGRES_PASSWORD:evaluacion123}
# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
spring.jpa.open-in-view=false


# JWT
app.jwt.secret=QM8G8J++F5pPilnt9enM4mKjc9VX7L+A6HIMWaTCA34=
app.jwt.expiration-ms=86400000

# CORS
app.cors.origin=http://localhost:5173
# Recuperación de contraseña
# Configura MAIL_ENABLED=true junto con MAIL_USERNAME y MAIL_PASSWORD para enviar por SMTP.
# El código también se registra en la consola del servidor para soporte administrativo.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.recovery.allowed-emails=fernando.castaneda25@itca.edu.sv,dennis.serrano25@itca.edu.sv,yesica.anaya25@itca.edu.sv,fatima.miranda25@itca.edu.sv

# SMTP. No guardes la contraseña en este archivo; usa variables de entorno.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Gmail SMTP usa smtp.gmail.com, puerto 587 y STARTTLS. MAIL_PASSWORD debe ser una contraseña de aplicación.
