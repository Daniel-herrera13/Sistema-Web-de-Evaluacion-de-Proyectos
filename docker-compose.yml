services:
  db:
    image: mariadb:10.11
    container_name: evaluacion-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root123
      MARIADB_DATABASE: evaluacion_proyectos
      MARIADB_USER: evaluacion
      MARIADB_PASSWORD: evaluacion123
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16
    container_name: evaluacion-db-postgres
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: evaluacion_proyectos
      POSTGRES_USER: evaluacion
      POSTGRES_PASSWORD: evaluacion123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evaluacion -d evaluacion_proyectos"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  postgres_data:
